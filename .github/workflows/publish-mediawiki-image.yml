name: Publicar imagem MediaWiki no GHCR

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-r[0-9]*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/image-tests.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verificar versão, tag e proveniência
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          config="$(docker compose config --format json)"
          version="$(jq -r '.services.mediawiki.build.args.MEDIAWIKI_VERSION' <<< "$config")"
          runtime="$(jq -r '.services.mediawiki.build.args.PHP_RUNTIME_VERSION' <<< "$config")"
          bash scripts/check-release-tag "$RELEASE_TAG" "$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "mediawiki=$version" >> "$GITHUB_OUTPUT"
          echo "php=$runtime" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .docker/mediawiki
          file: .docker/mediawiki/Dockerfile
          push: true
          build-args: |
            MEDIAWIKI_VERSION=${{ steps.version.outputs.mediawiki }}
            PHP_RUNTIME_VERSION=${{ steps.version.outputs.php }}
          tags: |
            ghcr.io/fiocruzlivre/mediawiki:${{ github.ref_name }}
            ghcr.io/fiocruzlivre/mediawiki:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/FiocruzLivre/mediawiki-development
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=FiocruzLivre MediaWiki
