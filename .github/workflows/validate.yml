name: Validar a imagem MediaWiki compartilhada

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bats and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq
      - name: Validar Compose local e override para banco externo
        run: bats test/compose.bats

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Iniciar wiki e serviços locais com volumes descartáveis
        run: docker compose up -d
      - name: Validate bootstrap and dependencies
        run: |
          set -euo pipefail
          # Startup copies the application to a persistent volume on its first run.
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          expected_php="$(docker compose config --format json | jq -r '.services.mediawiki.build.args.PHP_RUNTIME_VERSION | split("-")[0] | split(".") | .[0:2] | join(".")')"
          actual_php="$(docker compose exec -T mediawiki php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          test "$expected_php" = "$actual_php"
          expected_wiki="$(docker compose config --format json | jq -r '.services.mediawiki.build.args.MEDIAWIKI_VERSION')"
          actual_wiki="$(docker compose exec -T mediawiki php -r 'require "includes/Defines.php"; echo MW_VERSION;')"
          test "$expected_wiki" = "$actual_wiki"
          docker compose exec -T mediawiki php -m | grep -Fx 'memcached'
          docker compose exec -T mediawiki php -m | grep -Fx 'gd'
          docker compose exec -T mediawiki php -m | grep -Fx 'luasandbox'
          docker compose exec -T mediawiki php -m | grep -Fx 'apcu'
          docker compose exec -T mediawiki composer --no-interaction --version
          docker compose exec -T mediawiki composer audit --locked --no-dev
          docker compose exec -T mediawiki sh -c 'command -v unzip && command -v git'
          docker compose exec -T mediawiki sh -c 'test -f index.php && test -f includes/Defines.php'
          docker compose exec -T mediawiki sh -c 'test ! -k /var/www/mediawiki'
          docker compose exec -T database healthcheck.sh --connect --innodb_initialized
          curl -fsS http://127.0.0.1:8025/ >/dev/null
      - name: Conferir preservação dos arquivos e bloqueio de upgrade implícito
        shell: bash
        run: |
          set -euo pipefail
          before="$(docker compose exec -T mediawiki sha256sum composer.lock | cut -d' ' -f1)"
          docker compose restart mediawiki
          after="$(docker compose exec -T mediawiki sha256sum composer.lock | cut -d' ' -f1)"
          test "$before" = "$after"

          image="$(docker compose images -q mediawiki)"
          test -n "$image"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          mkdir -p "$temporary/includes"
          touch "$temporary/index.php"
          printf "%s\n" "<?php define( 'MW_VERSION', '0.0.0' );" > "$temporary/includes/Defines.php"
          sum_before="$(sha256sum "$temporary/includes/Defines.php" | cut -d' ' -f1)"
          if docker run --rm --network none \
              -v "$temporary:/var/www/mediawiki" "$image" > "$temporary/diagnostico" 2>&1; then
            echo "A imagem não bloqueou uma versão incompatível" >&2
            exit 1
          fi
          grep -Fq 'differs from image version' "$temporary/diagnostico"
          sum_after="$(sha256sum "$temporary/includes/Defines.php" | cut -d' ' -f1)"
          test "$sum_before" = "$sum_after"
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
