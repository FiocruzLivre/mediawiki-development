# Copy to docker-compose.override.yml for deployments with an external database.
# The reverse proxy reaches MediaWiki through Docker networking, not a published port.
services:
  mediawiki:
    ports: !reset []
    depends_on: !reset {}
    build:
      args:
        ENABLE_XDEBUG: "0"
    environment:
      XDEBUG_MODE: "off"
      WG_SERVER: ${WG_SERVER:?Set WG_SERVER in .env}
      WG_DB_SERVER: ${WG_DB_SERVER:?Set WG_DB_SERVER in .env}
      WG_DB_NAME: ${WG_DB_NAME:?Set WG_DB_NAME in .env}
      WG_DB_USER: ${WG_DB_USER:?Set WG_DB_USER in .env}
      WG_DB_PASSWORD: ${WG_DB_PASSWORD:?Set WG_DB_PASSWORD in .env}
      WG_SMTP_HOST: ${WG_SMTP_HOST:-}

  database:
    profiles: [local-only]
    ports: !reset []

  mailpit:
    profiles: [local-only]
    ports: !reset []
