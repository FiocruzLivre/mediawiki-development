name: Test MediaWiki image

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bats, jq and rsync
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq rsync
      - name: Validate environment, volume initialization and release tags
        run: bats test/compose.bats test/bootstrap.bats test/release-tag.bats

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bats and jq
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq
      - name: Build and start a disposable test environment
        run: docker compose up -d --build
      - name: Validate image functionality, Composer and persistent volumes
        run: bats test/image-integration.bats test/database-readiness.bats
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove disposable test environment
        if: always()
        run: docker compose down -v --remove-orphans
