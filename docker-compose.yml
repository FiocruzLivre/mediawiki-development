services:
  mediawiki:
    build:
      context: .docker/mediawiki
      args:
        # Image version is the source of truth. Existing source volumes are not automatically upgraded.
        MEDIAWIKI_VERSION: ${MEDIAWIKI_VERSION:-1.46.2}
        # Debugger is excluded from the image unless explicitly requested for local use.
        ENABLE_XDEBUG: ${ENABLE_XDEBUG:-0}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Bind to localhost for development; override HTTP_BIND_IP only with a trusted reverse proxy.
      - "${HTTP_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    environment:
      # Match local volume ownership for editing source files on the host.
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      TZ: ${TZ:-UTC}
      WG_SERVER: ${WG_SERVER:-http://localhost:8080}
      # These are only needed by a project-specific LocalSettings.php; the web installer
      # generates its own secrets when none is supplied.
      WG_SECRET_KEY: ${WG_SECRET_KEY:-}
      WG_UPGRADE_KEY: ${WG_UPGRADE_KEY:-}
      WG_DB_TYPE: ${WG_DB_TYPE:-mysql}
      WG_DB_SERVER: ${WG_DB_SERVER:-database}
      MYSQL_PORT: 3306
      WG_DB_NAME: ${WG_DB_NAME:-mediawiki}
      WG_DB_USER: ${WG_DB_USER:-wikiuser}
      WG_DB_PASSWORD: ${WG_DB_PASSWORD:-mediawiki}
      WG_MEMCACHED_SERVER: ${WG_MEMCACHED_SERVER:-memcached:11211}
      WG_SMTP_HOST: ${WG_SMTP_HOST:-mailpit}
      WG_SMTP_IDHOST: ${WG_SMTP_IDHOST:-mailpit}
      WG_SMTP_LOCALHOST: ${WG_SMTP_LOCALHOST:-}
      WG_SMTP_PORT: ${WG_SMTP_PORT:-1025}
      WG_SMTP_USERNAME: ${WG_SMTP_USERNAME:-}
      WG_SMTP_PASSWORD: ${WG_SMTP_PASSWORD:-}
      WG_SMTP_AUTH: ${WG_SMTP_AUTH:-0}
    volumes:
      # The entrypoint seeds a fresh source tree once; it refuses version mismatches.
      - ./volumes/mediawiki:/var/www/mediawiki
      # Optional app-specific overrides, e.g. LocalSettings.php.
      - ./volumes/src:/var/www/src:ro
      - composer-cache:/var/www/.composer

  database:
    image: mariadb:${MARIADB_VERSION:-11.8.9}
    restart: unless-stopped
    ports:
      # Development-only SQL access from the host; never bind to the public network.
      - "${MYSQL_BIND_IP:-127.0.0.1}:${MYSQL_PORT:-13306}:3306"
    environment:
      # Share credentials with the MediaWiki service; edit WG_DB_* only once in .env.
      MYSQL_DATABASE: ${WG_DB_NAME:-mediawiki}
      MYSQL_USER: ${WG_DB_USER:-wikiuser}
      MYSQL_PASSWORD: ${WG_DB_PASSWORD:-mediawiki}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-UTC}
    volumes:
      - ./volumes/mysql/dump:/docker-entrypoint-initdb.d:ro
      - ./volumes/mysql/data:/var/lib/mysql
    command: --max_allowed_packet=32505856
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  memcached:
    image: memcached:1.6.45-alpine
    restart: unless-stopped

  mailpit:
    # Captures outgoing email locally; replaces the unmaintained MailHog image.
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND_IP:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"
    networks:
      default:
        # Compatibility with installations that still use WG_SMTP_HOST=mailhog.
        aliases:
          - mailhog

volumes:
  composer-cache:
