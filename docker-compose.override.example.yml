# Copie para docker-compose.override.yml somente nas instalações sem banco local.
# MediaWiki fica disponível na rede Docker para o proxy reverso, sem porta pública.
services:
  mediawiki:
    ports: !reset []
    depends_on: !reset {}
    build:
      args:
        ENABLE_XDEBUG: "0"
    environment:
      XDEBUG_MODE: "off"
      WG_SERVER: ${WG_SERVER:?Defina WG_SERVER no .env}
      WG_DB_SERVER: ${WG_DB_SERVER:?Defina WG_DB_SERVER no .env}
      WG_DB_NAME: ${WG_DB_NAME:?Defina WG_DB_NAME no .env}
      WG_DB_USER: ${WG_DB_USER:?Defina WG_DB_USER no .env}
      WG_DB_PASSWORD: ${WG_DB_PASSWORD:?Defina WG_DB_PASSWORD no .env}
      WG_SMTP_HOST: ${WG_SMTP_HOST:-}

  database:
    profiles: [somente-local]
    ports: !reset []

  mailpit:
    profiles: [somente-local]
    ports: !reset []
