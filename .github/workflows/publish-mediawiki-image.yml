name: Publish MediaWiki image to GHCR

# Protected main only accepts reviewed changes. Every merged commit gets its own image.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq rsync

      - name: Determine release tags
        id: release
        env:
          IMAGE_REVISION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(docker compose config --format json | jq -er '.services.mediawiki.build.args.MEDIAWIKI_VERSION')"
          release="${version}-r${IMAGE_REVISION}"
          bash scripts/check-release-tag "$release" "$version"
          echo "tag=$release" >> "$GITHUB_OUTPUT"

      - name: Test configuration, startup and release tag rules
        run: bats test/compose.bats test/bootstrap.bats test/release-tag.bats

      - name: Build and start the image to be published
        run: docker compose up -d --build

      - name: Test the built image and database recovery
        run: bats test/image-integration.bats test/database-readiness.bats

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact image that passed integration tests
        env:
          IMAGE: ghcr.io/fiocruzlivre/mediawiki
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release tag ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          image_id="$(docker compose images -q mediawiki)"
          test -n "$image_id"
          docker image inspect "$image_id" >/dev/null

          docker tag "$image_id" "${IMAGE}:sha-${COMMIT_SHA}"
          docker tag "$image_id" "${IMAGE}:${RELEASE_TAG}"
          docker push "${IMAGE}:sha-${COMMIT_SHA}"
          docker push "${IMAGE}:${RELEASE_TAG}"
          echo "Published ${IMAGE}:${RELEASE_TAG} from ${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log failures
        if: failure()
        run: docker compose logs --tail=100

      - name: Remove test containers
        if: always()
        run: docker compose down -v --remove-orphans
